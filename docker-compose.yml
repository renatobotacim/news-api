services:
  mysql:
    image: mysql:8.0
    container_name: news-api-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: minha_prefeitura
      MYSQL_USER: minha_prefeitura
      MYSQL_PASSWORD: minha_prefeitura
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    image: news-api:latest
    container_name: news-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: minha_prefeitura
      DB_PASSWORD: minha_prefeitura
      DB_NAME: minha_prefeitura
      DB_POOL_LIMIT: 10
    ports:
      # Porta externa 8500 -> porta interna 3000 do container
      - "8500:3000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
